[project]
name = "valence-os-backend"
version = "0.1.0"
description = "Valence OS — v0 execution ledger (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",           # test client
    "anthropic>=0.40",       # optional 'api' extractor backend (see app/extractor.py)
    # Phase 3 (PHASE-3-SPEC.md §0b) — declared now, imported per-stage:
    "python-pptx>=1.0",      # real .pptx deck/kit export (Section 6)
    "ics>=0.7",              # calendar .ics read/write adapter (Section 8)
    # Email .eml parsing uses the stdlib `email` module — no dependency (see decisions.md D-73).
    # Transcription is an adapter interface with a mock impl (code, not a dependency).
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Only 'app' is an importable package here; 'migrations'/'tests' are data/tests, not packages.
# This makes `uv pip install -e .` work (flat-layout auto-discovery would otherwise error).
[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
