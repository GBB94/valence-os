# Account 1 of 3 — MULTI-PROGRAM. All names, people, and figures are fictional.
# Modeled (structure only) on a large global agriculture-equipment manufacturer running a
# coaching deployment: a global rollout, a Europe program blocked on works-council review,
# and a ~1,000 → ~3,000 seat expansion. NO real client data.

account:
  id: acc-terravance
  name: Terravance Agricultural Systems
  short_context: Global agriculture-equipment manufacturer; coaching deployment for people managers.
  incumbent_note: >
    Legacy L&D vendor "MentorWorks" holds current coaching/L&D budget; contract runs to next FY.
    Structured incumbent modeling deferred to v1.
  delivery_status: on_track
  delivery_status_rationale: Global rollout adoption tracking to plan; managers engaged.
  delivery_status_assessed_on: 2026-07-15
  delivery_status_change_condition: A stalled Europe launch or a cohort adoption drop would move this to at_risk.
  commercial_status: at_risk
  commercial_status_rationale: Expansion economics unproven; budget owner wants measured outcomes before funding 3k seats.
  commercial_status_assessed_on: 2026-07-15
  commercial_status_change_condition: Works-council clearance in Europe + a measured value story would move this to on_track.

