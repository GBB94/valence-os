# --- Programs (3) ---
programs:
  - id: prog-tv-global
    account_id: acc-terravance
    name: Global Coaching Rollout
    phase: programmatic
    region: Global
    audience: People managers
    use_case: Manager effectiveness coaching
    problem_statement: Inconsistent manager quality across regions after two reorgs.
    in_scope_population: ~1,000 people managers, initial paid cohort
    out_of_scope_population: Individual contributors; executives above VP
    launch_definition: 70% of invited managers activated within first 6 weeks
    success_criteria: Sustained weekly return above the Data-team-defined threshold; manager NPS positive
    expansion_hypothesis: Proven manager outcomes justify expanding beyond the initial cohort
    explicit_exclusions: No individual usage reporting to the client, ever
    sponsor_person_id: p-tv-champion

  - id: prog-tv-europe
    account_id: acc-terravance
    name: Europe Deployment
    phase: launch
    region: Europe (DE, FR, NL)
    audience: People managers, EU entities
    use_case: Manager effectiveness coaching
    problem_statement: Extend rollout to EU entities under local data & co-determination rules.
    in_scope_population: ~250 EU-based managers
    out_of_scope_population: Non-EU staff (covered by Global program)
    launch_definition: Works-council consultation complete and DPO sign-off obtained, then activate
    success_criteria: Launch without labor-relations escalation; parity adoption with global cohort
    expansion_hypothesis: Clean EU launch de-risks the broader expansion case
    explicit_exclusions: No launch before works-council consultation concludes
    sponsor_person_id: p-tv-progowner

  # NOTE (gap G1): the ~1,000 → ~3,000 seat expansion is modeled here as a Program in the
  # 'expansion' phase, NOT as an Expansion-opportunity object (that object is v1). The
  # target/economics live in expansion_hypothesis for now.
  - id: prog-tv-expansion
    account_id: acc-terravance
    name: Seat Expansion (1k → 3k)
    phase: expansion
    region: Global
    audience: People managers + senior individual-leadership tracks
    use_case: Scale coaching to a materially larger population
    problem_statement: Convert proven manager adoption into a larger paid population.
    in_scope_population: Target ~3,000 seats (from ~1,000 today)
    out_of_scope_population: TBD by budget owner
    launch_definition: Formal budget allocation + signed expansion terms
    success_criteria: Expansion funded and executed with a defensible value case
    expansion_hypothesis: Grow ~1,000 → ~3,000 seats once a measured value story exists and Europe launches cleanly
    explicit_exclusions: No expansion commitment before measured outcomes are shared
    sponsor_person_id: p-tv-budget

