# Global metric definitions, observations, and benchmarks (v2). All fictional.
# Definitions are Data-team-owned; the tool ingests, never recomputes. Benchmarks are
# versioned/sourced with population + period — never hard-coded numbers.

metric_definitions:
  - id: md-activation
    name: Activation rate
    meaning: Share of invited managers who activated the coach within 6 weeks.
    source_system: Valence Data team
    owner: Data team
    version: "2"
    population: Invited people managers
    stale_after_days: 30
  - id: md-weekly-return
    name: Weekly return
    meaning: Share of activated users returning in a given week (Data-team definition).
    source_system: Valence Data team
    owner: Data team
    version: "3"
    population: Activated users
    stale_after_days: 30

metric_observations:
  # A few months of history so the sparkline shows a trend. Latest (freshest current_through) wins.
  - {id: mo-3, definition_id: md-activation, definition_version: "2", program_id: prog-tv-global, period_label: "2026-05", value: 0.64, unit: ratio, target: 0.70, current_through: 2026-05-31}
  - {id: mo-4, definition_id: md-activation, definition_version: "2", program_id: prog-tv-global, period_label: "2026-06", value: 0.69, unit: ratio, target: 0.70, current_through: 2026-06-30}
  # Fresh observation (current_through recent) -> shows a value.
  - {id: mo-1, definition_id: md-activation, definition_version: "2", program_id: prog-tv-global, period_label: "2026-07", value: 0.72, unit: ratio, target: 0.70, current_through: 2026-07-10}
  # Weekly return history; latest current_through is old -> scoreboard renders "unknown" (stale), never carried-forward green.
  - {id: mo-5, definition_id: md-weekly-return, definition_version: "3", program_id: prog-tv-global, period_label: "2026-03", value: 0.38, unit: ratio, target: 0.45, current_through: 2026-03-31}
  - {id: mo-6, definition_id: md-weekly-return, definition_version: "3", program_id: prog-tv-global, period_label: "2026-04", value: 0.40, unit: ratio, target: 0.45, current_through: 2026-04-30}
  - {id: mo-2, definition_id: md-weekly-return, definition_version: "3", program_id: prog-tv-global, period_label: "2026-05", value: 0.41, unit: ratio, target: 0.45, current_through: 2026-05-20}

benchmarks:
  - {id: bm-1, name: Manager activation (enterprise cohort), value: 0.65, unit: ratio, population: F100 manager cohorts, period: H1 2026, source: Internal Data-team aggregate (fictional), version: "1"}

# v4 play definitions (trigger-and-response). Fire via "Evaluate plays".
play_definitions:
  - {id: pd-renewal, name: Renewal prep, trigger_kind: renewal_window, action_template: "Kick off renewal prep for {title}: confirm procurement timeline and multithread the budget owner.", active: 1}
  - {id: pd-overdue, name: Chase overdue commitment, trigger_kind: overdue_commitment, action_template: "Follow up on the overdue commitment: {title}.", active: 1}
  - {id: pd-stale, name: Re-warm stale relationship, trigger_kind: stale_stakeholder, action_template: "Reach out — {because}", active: 1}
  - {id: pd-second-champion, name: Build a second champion, trigger_kind: no_second_champion, action_template: "Build an independent champion thread. {because}", active: 1}
  - {id: pd-champion-quiet, name: Re-engage validated champion, trigger_kind: champion_gone_quiet, action_template: "Re-engage {title} with a concrete win. {because}", active: 1}
  - {id: pd-expansion-signal, name: Qualify expansion signal, trigger_kind: expansion_signal, action_template: "Qualify, attach, or dismiss: {because}", active: 1}
  - {id: pd-org-change, name: Work confirmed org change, trigger_kind: org_change_confirmed, action_template: "Work the confirmed change: {because}", active: 1}
  - {id: pd-calendar, name: Prepare deployment moment, trigger_kind: calendar_moment, action_template: "Prepare for {title}: {because}", active: 1}
  - {id: pd-land-leave, name: Investigate land and leave, trigger_kind: land_and_leave, action_template: "Investigate missed expansion: {because}", active: 1}
