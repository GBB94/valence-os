<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valence OS</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      // Mirrors the three-state model in App.jsx: stored choice is system|light|dark.
      (function () {
        try {
          var choice = localStorage.getItem("valence-theme");
          if (choice !== "light" && choice !== "dark" && choice !== "system") choice = "system";
          var applied = choice;
          if (choice === "system") {
            applied = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = applied;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
